<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">一般常識クイズ</h1>

    <section id="quiz" class="card">
      <p id="progress" class="progress"></p>
      <h2 id="question" class="question"></h2>
      <ul id="choices" class="choices"></ul>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next" class="btn" hidden>次へ</button>
    </section>

    <section id="result" class="card" hidden>
      <h2 class="question">結果発表</h2>
      <p id="score" class="score"></p>
      <p id="comment" class="comment"></p>
      <button id="retry" class="btn">もう一度挑戦する</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
